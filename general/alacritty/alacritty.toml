[font]
normal.family = "CaskaydiaCove Nerd Font"
# Without these, Alacritty takes whichever face of the family comes first,
# which differs between machines
normal.style = "Light"
bold.style = "Bold"
italic.style = "Light Italic"
bold_italic.style = "Bold Italic"
size = 13.0
# Same as kitty's cell_height 120%. Alacritty counts in screen pixels, and a
# Retina screen has twice as many, so a normal screen needs half of these.
offset.y = 6
glyph_offset.y = 3

[window]
opacity = 0.8
# Blur has no strength setting here, only on or off
blur = true
option_as_alt = "Both"

# Alacritty does not pass Ctrl+/ through, so LazyVim's terminal toggle
# never fires. \u001f is what other terminals send for it.
[keyboard]
bindings = [
  { key = "/", mods = "Control", chars = "\u001f" },
]

# Gruvbox Dark Hard, the same colors as kitty/current-theme.conf
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#bdae93"
text = "#665c54"

[colors.selection]
background = "#d65d0e"
text = "#ebdbb2"

[colors.normal]
black = "#3c3836"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
