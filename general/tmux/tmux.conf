# Plain tmux with the Oh my tmux key bindings. Needs tmux 3.2 or newer.
# Anything not set here is the tmux default.


# -- general -------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Older tmux waits 500 ms after Escape, which makes Neovim feel slow
set -s escape-time 10
set -g repeat-time 600
# Neovim needs this to notice files changed outside of it
set -s focus-events on

set -g default-terminal "tmux-256color"
# Without this, themes inside tmux fall back to 256 colours
set -as terminal-features ",*:RGB"

# Without these, Shift+Enter reaches programs as plain Enter
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Window and pane numbers follow the keyboard row, which starts at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Where this file is, for the two bindings below and for status.sh
set -gF @conf "#{current_file}"

# Through run, because new-window does not fill in #{@conf} itself
bind e run 'tmux new-window -n tmux.conf "\${EDITOR:-vim} \"#{@conf}\" && tmux source-file \"#{@conf}\" && tmux display \"config reloaded\""'
bind r run 'tmux source-file "#{@conf}"' \; display "config reloaded"

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history


# -- mouse and scrolling -------------------------------------------------------

set -g mouse on
set -g history-limit 50000

bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# tmux scrolls 5 lines per wheel step, which jumps on a trackpad
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 2 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 2 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 2 scroll-down

# tmux jumps back to the bottom when the mouse button is released. Copy and
# stay in place instead; a click clears the selection.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode    MouseDown1Pane    select-pane \; send -X clear-selection
bind -T copy-mode-vi MouseDown1Pane    select-pane \; send -X clear-selection


# -- clipboard -----------------------------------------------------------------

# Later lines win, so the order matters on machines that have several
if 'command -v xclip'    { set -s copy-command 'xclip -i -selection clipboard' }
if 'command -v xsel'     { set -s copy-command 'xsel -i -b' }
if '[ "$XDG_SESSION_TYPE" = wayland ] && command -v wl-copy' { set -s copy-command 'wl-copy' }
if 'command -v clip.exe' { set -s copy-command 'clip.exe' }
if 'command -v pbcopy'   { set -s copy-command 'pbcopy' }

bind y run -b 'tmux save-buffer - | #{copy-command}'


# -- navigation ----------------------------------------------------------------

bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# new panes open in the folder of the current pane
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

# Oh my tmux moves the pane to a new window; tmux's own zoom does the same job
bind + resize-pane -Z

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1
bind Tab last-window


# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode

# Vim keys in copy mode. tmux would also switch its command prompt to vim keys
# once EDITOR is vim, so that one is pinned to the normal keys.
setw -g mode-keys vi
set -g status-keys emacs

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line


# -- buffers -------------------------------------------------------------------

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer


# -- status bar ----------------------------------------------------------------

# The Oh my tmux bar: gruvbox dark hard, flat blocks. The dark background keeps
# it apart from the Neovim status line above it.
# status.sh has to sit in the same folder as this file.
set -g status-style "fg=#a89984,bg=#1d2021"
set -g status-left-length 100
set -g status-right-length 200

set -g status-left "#[fg=#1d2021,bg=#fabd2f,bold] ❐ #S #[fg=#ebdbb2,bg=#b16286,none] #(#{d:@conf}/status.sh uptime) #[default] "
set -g status-right "#{?client_prefix,#[fg=#1d2021#,bg=#fabd2f#,bold] 󰌌 PREFIX #[default] ,}#{?#{==:#{pane_mode},copy-mode},#[fg=#1d2021#,bg=#fe8019#,bold] 󰆏 COPY #[default] ,}#(#{d:@conf}/status.sh battery)#[fg=#a89984] | %R | %d %b #[fg=#ebdbb2,bg=#cc241d] #(whoami) #[fg=#1d2021,bg=#ebdbb2,bold] #h "

set -g window-status-separator " "
set -g window-status-format "#{?window_last_flag, ,}#I #W#{?window_bell_flag, !,}#{?window_zoomed_flag, Z,}#{?window_last_flag, ,}"
set -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-style "fg=#a89984,bg=#1d2021"
set -g window-status-current-style "fg=#1d2021,bg=#83a598,bold"
set -g window-status-last-style "fg=#83a598,bg=#3c3836"
set -g window-status-bell-style "fg=#fabd2f,blink,bold"

# Underlines a window in the bar when something happens in it
setw -g monitor-activity on
set -g window-status-activity-style "underscore"


# -- colours -------------------------------------------------------------------

set -g message-style "fg=#1d2021,bg=#fabd2f,bold"
set -g message-command-style "fg=#fabd2f,bg=#1d2021,bold"
set -g mode-style "fg=#1d2021,bg=#fabd2f,bold"
set -g pane-border-style "fg=#3c3836"
# Yellow while scrolling back, red while typing into all panes at once
set -g pane-active-border-style "fg=#{?pane_in_mode,#fabd2f,#{?synchronize-panes,#cc241d,#83a598}}"
set -g display-panes-colour "#83a598"
set -g display-panes-active-colour "#83a598"
set -g clock-mode-colour "#83a598"
